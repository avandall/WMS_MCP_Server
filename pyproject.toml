[project]
name = "wms-mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "mcp>=1.27.2",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "aio-pika>=9.0.0",
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
    "psutil>=7.2.2",
]

[dev-dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/test_tools", "tests/test_integration", "tests/test_mcp", "tests/test_packing_box_3d.py", "tests/test_picking_route_graph.py", "tests/test_smart_slotting.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
